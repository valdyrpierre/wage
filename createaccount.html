<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | WageTracker</title>
    <link rel="stylesheet" href="createaccount.css?v=5">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
    <script>
        // dark is the default, the same saved choice as every other page
        try { if (localStorage.getItem('theme') !== 'light') document.body.classList.add('dark'); }
        catch (e) { document.body.classList.add('dark'); }
    </script>
    <main>
        <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch dark and light theme"></button>
        <a class="auth-brand" href="homepage.html">💰 WageTracker</a>
        <header>
            <h1>Create your account</h1>
            <p class="auth-sub">Free, takes under a minute.</p>
        </header>

        <form id="signup-form">
            <div class="name-row">
                <div>
                    <label for="first-name">First name:</label>
                    <input type="text" id="first-name" name="first-name" autocomplete="given-name" maxlength="40" required>
                </div>
                <div>
                    <label for="last-name">Last name:</label>
                    <input type="text" id="last-name" name="last-name" autocomplete="family-name" maxlength="40" required>
                </div>
            </div>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" autocomplete="email" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" autocomplete="new-password" minlength="10" required>
            <div id="pw-bar"><span></span><span></span><span></span><span></span></div>
            <p id="pw-text" aria-live="polite"></p>

            <label for="confirm-password">Confirm password:</label>
            <input type="password" id="confirm-password" name="confirm-password" autocomplete="new-password" required>

            <label for="pay-start">Pay period start date <span class="optional">(optional)</span>:</label>
            <input type="date" id="pay-start" name="pay-start">
            <p class="field-hint">The first day of any one of your real pay periods. The Shifts page uses it to group your shifts. You can set it later on your Profile page.</p>

            <p id="error-msg" style="color: #dc2626; font-size: 0.85rem; margin-top: 10px;"></p>
            <p id="success-msg" style="color: #0f766e; font-size: 0.85rem; margin-top: 10px;"></p>

            <input type="submit" value="Create Account">
            <input type="button" value="Back to Login" onclick="window.location.href='login.html'">
        </form>

        <footer>
            <p>A personal project built for learning. <a href="homepage.html">Back to home</a></p>
        </footer>
    </main>

    <script>
        // theme button: switches dark and light and remembers it
        (function () {
            const button = document.getElementById('theme-toggle');
            function paint() { button.textContent = document.body.classList.contains('dark') ? '☀️' : '🌙'; }
            button.addEventListener('click', () => {
                const isDark = document.body.classList.toggle('dark');
                try { localStorage.setItem('theme', isDark ? 'dark' : 'light'); } catch (e) { }
                paint();
            });
            paint();
        })();
    </script>
    <script>
        // TODO: replace with your actual Supabase project values
        // Found in Supabase dashboard: Project Settings > API
        const SUPABASE_URL = 'https://wuuxogpncyixwxmlhdkz.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_4ProG0sjTH1-DCh9f5QsUg_L85xilyM';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function passwordProblems(pw, email) {
            const problems = [];
            const lower = pw.toLowerCase();
            const emailName = email.split('@')[0].toLowerCase();
            const kinds = [/[a-z]/, /[A-Z]/, /[0-9]/, /[^A-Za-z0-9]/].filter(re => re.test(pw)).length;

            if (pw.length < 10) problems.push('At least 10 characters');
            if (kinds < 3) problems.push('Mix 3 of: lowercase, UPPERCASE, numbers, symbols');
            if (['password', 'qwerty', '123456', 'abc123', 'letmein', 'welcome', 'admin'].some(w => lower.includes(w))) problems.push('No common words like "password" or "123456"');
            if (/(.)\1{4,}/.test(pw)) problems.push('No long runs of the same character');
            if (emailName.length >= 4 && lower.includes(emailName)) problems.push('Do not include your email name');
            return problems;
        }

        // fills the strength bar under the password box as the user types
        const passwordBox = document.getElementById('password');
        const barParts = document.querySelectorAll('#pw-bar span');
        const barText = document.getElementById('pw-text');
        passwordBox.addEventListener('input', () => {
            const pw = passwordBox.value;
            const problems = passwordProblems(pw, document.getElementById('email').value);
            // 0 = empty, 1 = weak, 2 = fair, 3 = good, 4 = strong (long and varied)
            let level = pw ? 1 : 0;
            if (pw && problems.length === 0) level = pw.length >= 16 ? 4 : pw.length >= 12 ? 3 : 2;
            const colors = ['', '#ef4444', '#f59e0b', '#22c55e', '#10b981'];
            barParts.forEach((part, i) => { part.style.background = i < level ? colors[level] : ''; });
            barText.textContent = pw ? ['', 'Weak', 'Fair', 'Good', 'Strong'][level] + (problems.length ? ': ' + problems[0] : '') : '';
            barText.style.color = colors[level];
        });

        const form = document.getElementById('signup-form');
        const errorMsg = document.getElementById('error-msg');
        const successMsg = document.getElementById('success-msg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.textContent = '';
            successMsg.textContent = '';

            const firstName = document.getElementById('first-name').value.trim();
            const lastName = document.getElementById('last-name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const payStart = document.getElementById('pay-start').value; // empty string when skipped

            // ---- validation before ever contacting Supabase ----

            if (!firstName || !lastName) {
                errorMsg.textContent = 'Please enter your first and last name.';
                return;
            }

            // simple email format check (not exhaustive, but catches obvious typos
            // like missing "@" or "." — the type="email" input already helps too)
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailPattern.test(email)) {
                errorMsg.textContent = 'Please enter a valid email address.';
                return;
            }

            // the same rules the strength bar shows. Supabase enforces its own policy as well
            const problems = passwordProblems(password, email);
            if (problems.length) {
                errorMsg.textContent = 'Password is too weak. ' + problems[0] + '.';
                return;
            }

            if (password !== confirmPassword) {
                errorMsg.textContent = 'The two passwords do not match.';
                return;
            }

            // the name and pay period start are saved with the account itself (the same
            // place the Profile page reads them), so nothing is asked again after login
            const { data, error } = await supabaseClient.auth.signUp({
                email: email,
                password: password,
                options: {
                    data: {
                        full_name: firstName + ' ' + lastName,
                        pay_period_start: payStart || null
                    }
                }
            });

            if (error) {
                // "User already registered" would tell an attacker that this email has an account,
                // so that case gets a neutral message. password rule and rate limit errors are safe to show
                if (error.status === 429) {
                    errorMsg.textContent = 'Too many attempts. Please wait a few minutes and try again.';
                } else if (error.code === 'weak_password') {
                    errorMsg.textContent = 'Password is too weak. Use at least 10 characters with a mix of letters, numbers and symbols.';
                } else {
                    errorMsg.textContent = 'We could not create your account with those details. Please check them and try again, or log in if you already have an account.';
                }
                return;
            }

            // Account created successfully.
            // NOTE: this redirect only works immediately if "Confirm email"
            // is turned OFF in Supabase (Authentication > Sign In / Providers > Email).
            // If confirmation is required, there is no active session yet,
            // and the user must confirm via email before being logged in.
            if (!data.session) {
                // email confirmation is on, so there is no login yet
                successMsg.textContent = 'Account created! Check your email to confirm it, then log in.';
                return;
            }
            successMsg.textContent = 'Account created! Redirecting...';
            window.location.href = 'userinfo.html';
        });
    </script>
</body>

</html>
